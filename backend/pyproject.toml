[project]
name = "clinical-notes-api"
version = "0.1.0"
description = "Backend API for the Clinical Notes Workflow"
authors = [
    { name = "NDT2000", email = "nayan200000@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "pwdlib[argon2]>=0.2",
    "pydantic-settings>=2.6",
    "pyjwt>=2.10",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
clinical-notes-api = "clinical_notes_api:main"
clinical-notes-seed = "clinical_notes_api.seed.__main__:main"
clinical-notes-create-admin = "clinical_notes_api.accounts.create_admin:main"
clinical-notes-openapi = "clinical_notes_api.openapi:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=8.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["clinical_notes_api"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 95
exclude_also = ['if __name__ == "__main__":']

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "S",   # bandit security checks
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is how pytest checks
