# Backend checks: lint, formatting, and the full test suite against a real
# Postgres (the same pgvector image as docker-compose.yml) and Redis.
name: Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "contract/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "contract/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: clinical
          POSTGRES_PASSWORD: clinical
          POSTGRES_DB: clinical_notes
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clinical -d clinical_notes"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://clinical:clinical@localhost:5432/clinical_notes
      # Fail, rather than skip, the database tests if Postgres is missing.
      REQUIRE_DATABASE: "1"
      # The Redis relay test; the other tests use the in-process relay.
      TEST_REDIS_URL: redis://localhost:6379/0
      REQUIRE_REDIS: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # Python 3.13 comes from backend/.python-version.
      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest --cov --cov-report=term-missing
